name: AWS Infrastructure Shift-Left CI/CD

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  security-and-lint:
    name: Security Scan & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -recursive environments/

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-shortcut-text: 'true'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Stale Local Terraform Artifacts
        run: |
          rm -rf environments/dev/.terraform
          rm -f environments/dev/.terraform.lock.hcl

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1
          terraform_wrapper: false

      - name: Terraform Init & Validate
        run: |
          cd environments/dev
          terraform init -backend=false -reconfigure
          terraform validate

      - name: LocalStack Deployment Simulation
        if: ${{ env.ACT }}
        run: |
          echo "[*] Local execution detected via nektos/act."
          echo "[*] Pipeline validated successfully."
